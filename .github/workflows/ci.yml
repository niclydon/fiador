name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  packages:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test

  badge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm ci
      - run: npm run build --workspace=@fiador/verify
      - run: npm ci --prefix badge-service
      - run: npm run build --prefix badge-service
      - run: npm run typecheck --prefix badge-service
      - run: npm test --prefix badge-service

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e './packages/verify-py[test]'
      - run: python -m pytest -q packages/verify-py/tests

  cross-language:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run build --workspace=@fiador/verify
      - run: python -m pip install build mypy
      - run: python -m build --wheel --outdir /tmp/fiador-py-wheel packages/verify-py
      - run: python packages/verify-py/tests/check_wheel_typing.py /tmp/fiador-py-wheel
      - run: python -m pip install -e packages/verify-py
      - run: python packages/verify-py/tests/check_cross_language_parity.py
